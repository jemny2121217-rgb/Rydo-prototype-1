<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RideNow | Book Your Ride</title>
    <style>
        :root {
            --primary: #000000;
            --accent: #27ae60;
            --bg: #f4f6f8;
            --card-bg: #ffffff;
            --text: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--primary);
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
        }

        main {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            max-width: 1200px;
            margin: 2rem auto;
            width: 90%;
            gap: 2rem;
        }

        .booking-panel {
            flex: 1;
            min-width: 320px;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .map-panel {
            flex: 1.5;
            min-width: 320px;
            background: #e0e0e0;
            border-radius: 12px;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .map-placeholder {
            color: #666;
            font-size: 1.2rem;
            text-align: center;
        }

        h2 {
            margin-bottom: 1.5rem;
        }

        .input-group {
            margin-bottom: 1.2rem;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
        }

        .ride-options {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .ride-option {
            flex: 1;
            border: 2px solid #eee;
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .ride-option:hover, .ride-option.selected {
            border-color: var(--accent);
            background-color: #f0fff4;
        }

        .btn-request {
            width: 100%;
            padding: 1rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-request:hover {
            background-color: #222;
        }

        .status-card {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 6px;
            background-color: #e8f5e9;
            color: #2e7d32;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">RideNow</div>
        <nav>
            <span style="color: white; margin-right: 15px;">Hello, Rider</span>
        </nav>
    </header>

    <main>
        <section class="booking-panel">
            <h2>Request a Ride</h2>
            
            <div class="input-group">
                <label for="pickup">Pickup Location</label>
                <input type="text" id="pickup" placeholder="Enter pickup address">
            </div>

            <div class="input-group">
                <label for="dropoff">Dropoff Location</label>
                <input type="text" id="dropoff" placeholder="Enter destination">
            </div>

            <label style="display:block; margin-bottom: 0.5rem; font-size: 0.9rem; font-weight: 600;">Select Option</label>
            <div class="ride-options">
                <div class="ride-option selected" onclick="selectOption(this, 12.50)">
                    <strong>Economy</strong>
                    <div>$12.50</div>
                </div>
                <div class="ride-option" onclick="selectOption(this, 22.00)">
                    <strong>Comfort</strong>
                    <div>$22.00</div>
                </div>
                <div class="ride-option" onclick="selectOption(this, 35.00)">
                    <strong>XL</strong>
                    <div>$35.00</div>
                </div>
            </div>

            <button class="btn-request" onclick="handleBooking()">Book Ride</button>

            <div id="statusCard" class="status-card">
                Finding nearby drivers...
            </div>
        </section>

        <section class="map-panel">
            <div class="map-placeholder">
                📍 Map Interface Placeholder<br>
                <small>(Integrate Google Maps or Mapbox API here)</small>
            </div>
        </section>
    </main>

    <script>
        function selectOption(element, price) {
            document.querySelectorAll('.ride-option').forEach(opt => opt.classList.remove('selected'));
            element.classList.add('selected');
        }

        function handleBooking() {
            const pickup = document.getElementById('pickup').value;
            const dropoff = document.getElementById('dropoff').value;
            const statusCard = document.getElementById('statusCard');

            if (!pickup || !dropoff) {
                alert('Please enter both pickup and dropoff locations.');
                return;
            }

            statusCard.style.display = 'block';
            statusCard.innerHTML = `<strong>Requesting Ride...</strong><br>From: ${pickup}<br>To: ${dropoff}`;

            setTimeout(() => {
                statusCard.innerHTML = `<strong>Driver En Route!</strong><br>John (Toyota Prius • ABC-1234) is 4 mins away.`;
            }, 3000);
        }
    </script>
</body>
  </html>
